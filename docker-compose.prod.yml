# Production stack (spec sections 28-31). PostgreSQL with a persistent volume;
# the app reads DATABASE_URL from the environment. Backups: use pg_dump on the
# volume (documented in README / ops docs).
#
#   docker compose -f docker-compose.prod.yml up -d --build
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-endurance}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-endurance_prod}
    volumes:
      - endurance_pg_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-endurance} -d ${POSTGRES_DB:-endurance_prod}"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      args:
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 8080
      APP_URL: ${APP_URL:?set APP_URL}
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      COOKIE_SAME_SITE: ${COOKIE_SAME_SITE:-lax}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_MONTHLY_PRICE_ID: ${STRIPE_MONTHLY_PRICE_ID:-}
      STRIPE_ANNUAL_PRICE_ID: ${STRIPE_ANNUAL_PRICE_ID:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://app.example.com}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "${APP_PORT:-8080}:8080"

  # Cloudflare quick tunnel (free, no account): exposes the app on a random
  # https://<random>.trycloudflare.com URL. Read the URL from the logs:
  #   docker compose -f docker-compose.prod.yml logs cloudflared
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://app:8080
    depends_on:
      - app

volumes:
  endurance_pg_prod:
