# Test PostgreSQL (Fase 1). Ephemeral (no volume) so every test run starts clean.
#   docker compose -f docker-compose.test.yml up -d
services:
  postgres:
    image: postgres:16-alpine
    container_name: endurance-postgres-test
    environment:
      POSTGRES_USER: endurance
      POSTGRES_PASSWORD: endurance
      POSTGRES_DB: endurance_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U endurance -d endurance_test"]
      interval: 5s
      timeout: 3s
      retries: 10
